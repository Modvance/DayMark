<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Daymark · 桌面组件</title><link rel="stylesheet" href="panel.css"></head><body><main class="panel">
<div class="resize-handle n" data-edge="n"></div><div class="resize-handle s" data-edge="s"></div><div class="resize-handle e" data-edge="e"></div><div class="resize-handle w" data-edge="w"></div><div class="resize-handle ne" data-edge="ne"></div><div class="resize-handle nw" data-edge="nw"></div><div class="resize-handle se" data-edge="se" title="拖动调整尺寸"></div><div class="resize-handle sw" data-edge="sw"></div>
<header class="drag-bar"><button id="open-main" class="brand" title="打开完整日程"><span data-icon="check"></span>Daymark</button><div class="tools"><button id="panel-pin" title="切换桌面与置顶模式" aria-label="切换桌面与置顶模式" data-icon="pin"></button><button id="collapse" title="折叠组件" aria-label="折叠组件" data-icon="minus"></button><button id="hide" title="隐藏组件" aria-label="隐藏组件" data-icon="close"></button></div></header>
<section class="widget-heading"><div><div id="date" class="date"></div><h1>今天<span id="compact-count"></span></h1><span id="compact-goal" class="compact-goal" hidden></span><div id="progress-text" class="progress-label">从一件重要的事开始。</div></div><div class="mini-ring"><svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="25" class="track"/><circle cx="30" cy="30" r="25" class="value" id="widget-ring"/></svg><b id="remaining">0</b></div></section>
<div class="expanded-content"><progress id="progress" max="1" value="0" aria-label="今日完成进度"></progress><div id="preview-note" hidden>浏览器预览 · <button id="load-demo">载入示例</button></div><div class="widget-toolbar"><nav class="tabs" aria-label="任务视图"><button id="tab-today" class="selected" aria-pressed="true">今日任务</button><button id="tab-deadline" aria-pressed="false">截止日期</button></nav><button id="panel-settings" class="settings-button" title="组件设置" aria-label="组件设置" data-icon="settings"></button></div><button id="overdue-count" class="overdue-summary" hidden></button><div id="list" class="list" aria-live="polite"></div><button id="completed-filter" class="completed-filter" hidden></button><div id="undo-bar" hidden><span>任务已完成</span><button id="undo">撤销</button></div><section class="widget-goals" id="widget-goals"><div class="widget-goals-heading"><span>目标倒计时</span><button id="open-goals" title="查看所有目标">全部 <span data-icon="chevron"></span></button></div><div id="widget-goal-list"></div></section><footer><form id="quick-form"><span data-icon="plus"></span><input id="quick-title" required maxlength="200" placeholder="添加今日任务" aria-label="新任务标题"><button type="submit" aria-label="添加今日任务" title="添加今日任务" data-icon="arrow"></button></form><div class="footer-links"><span id="status">已保存</span><select id="quick-goal" aria-label="新任务关联目标"><option value="">不关联目标</option></select><button id="open-add">详细新建 ↗</button></div></footer></div>
<dialog id="preferences"><form method="dialog"><div class="dialog-heading"><h2>组件设置</h2><button aria-label="关闭设置" data-icon="close"></button></div></form><div class="preference-group"><label>主题<select id="appearance"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>快捷尺寸<select id="panel-size"><option value="small">小号</option><option value="normal">标准</option><option value="large">大号</option></select></label><label>不透明度<output id="opacity-value">96%</output></label><input id="opacity" type="range" min="70" max="100" step="1" aria-label="不透明度"></div><div class="preference-label">默认尺寸</div><div class="default-size"><label>宽度<input id="default-width" type="number" required min="280" max="1000" step="1"></label><label>高度<input id="default-height" type="number" required min="360" max="1400" step="1"></label></div><button id="save-default" class="primary">保存默认尺寸</button><button id="current-default">将当前尺寸设为默认</button><button id="restore-size">恢复默认尺寸</button><p>拖动顶部移动，拖动边缘缩放。关闭置顶后，组件固定在 Windows 桌面层。</p><button id="reset-position">找回组件</button><button id="preferences-main">打开完整日程 ↗</button></dialog><div id="toast" role="status" hidden></div></main><script src="domain.js"></script><script src="ui.js"></script><script src="panel.js"></script></body></html>
